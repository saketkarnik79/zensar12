<h2>List of Customers</h2>
<table class = 'table'>
    <thead>
        <tr>
            <th>Customer Id</th>
            <th>Name</th>
            <th>City</th>
            <th>State</th>
            <th>Country</th>
        </tr>
    </thead>
    <tbody>
        <!-- <tr *ngFor="let c of customers;">
            <td>{{ c.customerId }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.city }}</td>
            <td>{{ c.state }}</td>
            <td>{{ c.country }}</td>
        </tr> -->
        @for(c of customers; track c.customerId){
            <tr>
                <td>{{ c.customerId }}</td>
                <td>{{ c.name }}</td>
                <td>{{ c.city }}</td>
                <td>{{ c.state }}</td>
                <td>{{ c.country }}</td>
            </tr>
        }
    </tbody>
</table>
